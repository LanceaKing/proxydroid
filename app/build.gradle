plugins {
    id 'com.android.application'
}

def tlsBackend = providers.gradleProperty('tlsBackend').getOrElse('openssl')
if (!(tlsBackend in ['openssl'])) {
    throw new GradleException("tlsBackend=${tlsBackend} is not supported by libevent 2.1.13-stable; supported: openssl")
}

android {
    namespace "org.proxydroid"
    compileSdk 29
    ndkVersion '25.1.8937393'

    defaultConfig {
        applicationId "org.proxydroid"
        minSdk 19
        //noinspection ExpiredTargetSdkVersion
        targetSdk 29
        versionCode 72
        versionName "3.2.0"

        externalNativeBuild {
            cmake {
                arguments "-DTLS_BACKEND=${tlsBackend}", '-DBUILD_TESTING=OFF'
                if (project.hasProperty('tlsArchive')) {
                    arguments "-DPROXYDROID_TLS_ARCHIVE=${project.property('tlsArchive')}"
                }
            }
        }
        ndk {
            // Specifies the ABI configurations of your native
            // libraries Gradle should build and package with your APK.
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        aidl true
    }

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path "src/main/cpp/CMakeLists.txt"
            buildStagingDirectory file(".cxx/${tlsBackend}")
        }
    }
}

configurations {
    compile.exclude group: "junit", module: "junit"
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'
    implementation 'com.github.topjohnwu.libsu:service:6.0.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.preference:preference:1.1.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation('com.googlecode.json-simple:json-simple:1.1.1') {
        exclude group: 'junit', module: 'junit'
    }
    implementation 'org.mozilla:rhino:1.7.11'
}
