name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Four ABI APK / ${{ matrix.tls }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tls: [openssl]
    steps:
      - name: Check out source and pinned native dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK and build dependencies
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platform-tools
            platforms;android-29
            build-tools;33.0.1
            ndk;25.1.8937393
            cmake;3.22.1

      - name: Fetch checksum-locked TLS archive
        id: tls
        run: echo "archive=$(python3 scripts/fetch-native-deps.py '${{ matrix.tls }}')" >> "$GITHUB_OUTPUT"

      - name: Build debug and release APKs for all four ABIs
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --console=plain \
            -PtlsArchive=file://${{ steps.tls.outputs.archive }}

      - name: Verify debug and release libraries and JNI contracts
        run: |
          readelf="$ANDROID_HOME/ndk/25.1.8937393/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          python3 scripts/verify-native-engine.py --readelf "$readelf" \
            --output app/build/reports/native-engine.json
          python3 scripts/verify-native-engine.py app/build/outputs/apk/release/app-release-unsigned.apk \
            --readelf "$readelf" --output app/build/reports/native-engine-release.json

      - name: Upload APK and native validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxydroid-debug-release-${{ matrix.tls }}
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/reports/native-engine.json
            app/build/reports/native-engine-release.json
